# Rivers. Lives here rather than in the world conf so a world reset cannot
# revert it -- note this OVERRIDES the mod's own defaults, which is why editing
# mapgen_rivers/settings_default.conf alone has no effect.
#
# min_catchment is the drainage area needed before something is drawn as a
# river, in square nodes. Divided by blocksize squared it gives the figure that
# actually matters: cells of drainage. This was 200, which over a 30-node grid
# is 0.22 cells -- below the smallest possible flow, so nothing was ever
# rejected and every cell of the map became a river. Measured on a real
# 2066x2066 grid: 100% of the grid carrying water, and no land anywhere further
# than 90 nodes from some of it.
#
# It was set that low to force upstream rivers to appear at all, back when the
# river heightmap and v7's terrain were unrelated landscapes that only agreed
# near sea level. Seeding the erosion simulation from v7's own base terrain
# fixed that at the source, so the workaround is no longer needed.
#
#   60000 -> 10% of the grid carries a river, 68% of land is >90n from one
#   25000 -> 15%,                             43% of land >90n
#   Both leave the largest rivers at the full 2*blocksize cap.
mapgen_rivers_min_catchment = 60000
# Restored to the mod default. Paired with the threshold above this gives WIDER
# rivers than before, not narrower: the 90th percentile goes 3.7 -> 8.5 nodes,
# because what stops being drawn is the sub-node trickles, not real rivers.
mapgen_rivers_river_widening_power = 0.5
