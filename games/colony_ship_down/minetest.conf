# Colony Ship Down defaults (players/servers can override in their own minetest.conf)
mg_name = singlenode
enable_damage = true
enable_pvp = false
creative_mode = false
static_spawnpoint =
time_speed = 0
enable_fire = false
enable_tnt = false
# Lots of people, mostly standing around chatting
max_users = 64
# ffadventure engine features
enable_colored_lighting_tint = true
colored_lighting_samples = 8
colored_lighting_max_distance = 2
# Space is wide open: send and pre-generate further so EVA and window views load quickly
max_block_send_distance = 16
max_block_generate_distance = 16
block_send_optimize_distance = 6
max_simultaneous_block_sends_per_client = 60
# Weapons: ship windows aren't glass, but keep glass-breaking off anyway
rangedweapons_glass_breaking = false
# TNT blocks don't ignite; explosive rounds can't damage the ship (protected)

# Water physics (dynamic_liquid) only for water spilled aboard - no springs, rivers or lava
dynamic_liquid_springs = false
dynamic_liquid_mapgen_prefill = false
dynamic_liquid_lava = false
dynamic_liquid_river_water = false
# Sanity (bewarethedark): only the ship's lamps count - no sunlight in deep space.
# Power failures and dark EVAs get unnerving.
bewarethedark_artificial_only = true
