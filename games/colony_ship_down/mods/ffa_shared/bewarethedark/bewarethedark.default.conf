--[[

Beware the Dark configuration
-----------------------------

To modify the configuration without fear of it being overwritten
by an update of this mod, copy this file to

  bewarethedark.conf

in the mod directory or the directory of a specific world, and
modify away. The mod will read configuration first from the
default file, then from the mod directory copy, and finally from
the world directory copy.

The settings from these locations will be merged together in an
intelligent fashion. Normal entries in the config table will get
overwritten. Table entries (those with {} at the left of the =)
will get merged together, unless the special table entry 'CLEAR'
is given, with a true value. This merging does not go deeper than
one level, but this should be sufficient.

]]

bewarethedark.config = {

    -- Update period in seconds. 1s gives smooth convergence without
    -- excessive per-tick cost on multiplayer servers.
    tick_time = 1.0,

    -- Target sanity (0-20) the player converges toward at each light level.
    -- Higher = calmer. The player's sanity lerps toward this value over time.
    target_for_light = {
        [15] = 20,      -- bright sunlight — full calm
        [14] = 18,      -- torch level — comfortable
        [13] = 18,
        [12] = 16,      -- dim but safe
        [11] = 16,
        [10] = 16,
        [ 9] = 14,      -- dusk zone — slightly uneasy
        [ 8] = 14,
        [ 7] = 10,      -- murky — uncomfortable
        [ 6] = 10,
        [ 5] = 6,       -- dark — frightening
        [ 4] = 6,
        [ 3] = 3,       -- very dark — terrifying
        [ 2] = 3,
        [ 1] = 1,       -- near-pitch — dread
        [ 0] = 0,       -- total darkness — despair
    },

    -- Lerp rate per tick when sanity is draining (moving toward a lower target).
    -- Lower = slower drain. At 0.006 with 1s tick:
    --   1 min in darkness: 20 → ~14
    --   3 min in darkness: 20 → ~7
    --   5 min in darkness: 20 → ~3
    drain_rate = 0.024,

    -- Lerp rate per tick when sanity is recovering (moving toward a higher target).
    -- 3x faster than drain — finding light is immediately rewarding.
    recovery_rate = 0.018,

    -- HP damage begins when sanity drops below this threshold.
    dmg_threshold = 3,

    -- Maximum HP damage per second at sanity 0. Scales linearly:
    --   dps = (threshold - sanity) / threshold * dmg_max_dps
    -- At 0.5: takes 40 seconds to kill a 20 HP player at sanity 0.
    dmg_max_dps = 0.5,
}
