name = tanning_rack
description = A tanning rack for working cured leather into finished tanned leather by punching.
depends = default
# tanning_rack -> drying_rack is the ONLY direction of this dependency (tanning
# consumes drying_rack:cured_leather). drying_rack must NOT list tanning_rack
# back, or the two form a load-order cycle -> "dependency loop" crash.
optional_depends = drying_rack, animalia, mobs, mobs_animal, petz, water_life, animalworld, backpacks, armor_expanded
