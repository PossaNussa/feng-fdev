name = drying_rack
author = Tydragon, Kindaglia (reworked for FFAdventure)
title = Drying Rack
description = Hang raw meat, fish, fruit or hides to dry slowly into preserved food and cured leather. Drying is faster near torches or fire.
depends = default
# NOTE: do NOT add tanning_rack here. tanning_rack optional_depends on
# drying_rack (it consumes drying_rack:cured_leather), so listing it back here
# forms a load-order cycle -> "dependency loop" crash. drying_rack never needs
# tanning_rack loaded first: its leather scan excludes "tanning_rack:" items by
# name prefix, which works regardless of order.
optional_depends = animalia, animalworld, mobs, mobs_animal, zombies, fishing_rod, fire, farming, x_farming, naturalbiomes, redw, hardcore_farming, worm_farm, petz, water_life, flowers
