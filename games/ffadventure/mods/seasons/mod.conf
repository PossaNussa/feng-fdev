name = seasons
title = Seasons
description = """
A four-season system driven by the in-game calendar: gold and brown foliage in
autumn, snow and cold in winter, melt and green-up in spring, lush warmth in
summer. Shifts the inputs that climate_api, always_greener and tempsurvive
already read, rather than replacing any of them.
"""
depends = seasons_clock
optional_depends = default, calendar, climate_api, regional_weather, always_greener, tempsurvive, farming, dtrees, climate_zones_v7
