name = village_life
title = Village Life
description = Gives mg_villages inhabitants a life: a daily routine, a family, a religion, a memory of you and of each other, and a death that sticks. They work their assigned workstations, sleep in their own beds, keep the bees they claim to keep, gossip about what they have seen, mourn their dead, and trade from stock that differs per villager, per village and per season.
depends = mg_villages, creaturemob, lottmobs, default
optional_depends = climate_api, regional_weather, seasons, doors, cottages, simplecoins, zombies, mobf_trader, lumberjackzombie, x_farming, flowers, farming, bones, proxchat, calendar
