# --- Mapgen v8 -------------------------------------------------------------
# v8 feature flags
mgv8_spflags (Mapgen V8 flags) flags mountains,volcanoes,rivers,strata_caves,no_floaters
	volcanoes (Enable volcano cone overlay)
	rivers (Enable sloped rivers)
	mountains (Apply uplift above mount_zero_level)
	strata_caves (Reserve flag for strata-aware cave tuning)
	no_floaters (Extra clamp to reduce floating outcrops)

# Heightfield & warping
mgv8_np_height_base (v8 noise: base height) v3f(384,384,384) 0,1,82341,5,0.6,2.0
mgv8_np_height_alt (v8 noise: alt height) v3f(256,256,256) 0,1,19387,5,0.55,2.0
mgv8_np_height_select (v8 noise: blend) v3f(512,512,512) 0,1,12213,5,0.66,2.0
mgv8_np_warp_u (v8 noise: warp u) v3f(768,768,768) 0,1,53211,3,0.5,2.0
mgv8_np_warp_v (v8 noise: warp v) v3f(1024,1024,1024) 0,1,94111,3,0.5,2.0

# Rivers
mgv8_np_river (v8 noise: river mask) v3f(1024,1024,1024) 0,1,77121,3,0.5,2.0
mgv8_river_threshold (v8 river mask threshold) float 0.55 0.0 1.0
mgv8_river_depth (v8 base river depth) s16 6

# Caves
mgv8_np_cave1 (v8 noise: caves 1) v3f(61,61,61) 0,12,52534,3,0.5,2.0
mgv8_np_cave2 (v8 noise: caves 2) v3f(67,67,67) 0,12,10325,3,0.5,2.0
mgv8_cave_ymin (v8 caves ymin) s16 -31000
mgv8_cave_ymax (v8 caves ymax) s16 31000
mgv8_cave_mask_clearance (v8 min roof thickness) s16 4
mgv8_entrance_rate_ppm (v8 cave entrances per million nodes) u32 120 0 1000000

# Volcanoes
mgv8_np_volcano (v8 noise: volcano sparse) v3f(4096,4096,4096) 0,1,99131,2,0.5,2.0
mgv8_volcano_rate_ppm (v8 volcano cells per million) u32 3 0 1000000

# Macro tuning
mgv8_mount_zero_level (v8 mountain uplift baseline) s16 32
mgv8_warp_strength (v8 domain warp strength) float 40.0 0.0 400.0
mgv8_south_ocean_span (v8 south ocean endcap width) s16 8000
