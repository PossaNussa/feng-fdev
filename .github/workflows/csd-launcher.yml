name: Colony Ship Down launcher

# Builds the Colony Ship Down download-and-play launcher (Windows + Linux
# zips) from this repo's engine, with games/colony_ship_down/launcher.
# Push a tag like v1.0.0 to make a GitHub release with both zips attached,
# or run it by hand from the Actions tab.

on:
  push:
    tags: ["csd-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows x86_64
    # Cross-compiled with the engine's own buildbot (llvm-mingw + prebuilt
    # libs), the same way official Luanti Windows builds are made.
    runs-on: ubuntu-22.04
    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: { path: engine, fetch-depth: 1 }
      - name: Build engine
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext zip
          sudo ./engine/util/buildbot/download_toolchain.sh /usr
          mkdir -p engine/client/serverlist   # empty dir the install step expects; git drops it
          EXISTING_MINETEST_DIR=$PWD/engine ./engine/util/buildbot/buildwin64.sh B
          mkdir -p win && unzip -q -d win B/build/*.zip
          mkdir -p build && mv win/*/bin build/bin
      - name: Sign (optional)
        if: ${{ env.AZURE_TENANT_ID != '' }}
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\build\bin
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Package
        run: |
          bash engine/games/colony_ship_down/launcher/package.sh engine build/bin/luanti.exe dist build/bin/*.dll
          mv dist/ColonyShipDown.zip dist/ColonyShipDown-windows.zip
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/ColonyShipDown-windows.zip, if-no-files-found: error }

  linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04   # older glibc = runs on more distros
    steps:
      - uses: actions/checkout@v4
        with: { path: engine, fetch-depth: 1 }
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build zip \
            libsdl2-dev libopenal-dev libgl1-mesa-dev libxrandr-dev libxi-dev \
            libjpeg-dev libpng-dev zlib1g-dev libzstd-dev libbz2-dev \
            libsqlite3-dev libjsoncpp-dev libluajit-5.1-dev \
            libogg-dev libvorbis-dev libcurl4-openssl-dev libgmp-dev gettext
      - name: Build engine
        run: |
          # no optional database backends: the game uses sqlite, and these would
          # need extra libraries installed on the player's / host's machine
          cmake -S engine -B build -G Ninja -DRUN_IN_PLACE=TRUE -DCMAKE_BUILD_TYPE=Release -DBUILD_SERVER=FALSE \
            -DENABLE_POSTGRESQL=OFF -DENABLE_LEVELDB=OFF -DENABLE_REDIS=OFF -DENABLE_SPATIAL=OFF
          cmake --build build -j"$(nproc)"
          strip engine/bin/luanti || true
      - name: Package
        run: |
          bash engine/games/colony_ship_down/launcher/package.sh engine engine/bin/luanti dist
          mv dist/ColonyShipDown.zip dist/ColonyShipDown-linux.zip
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: dist/ColonyShipDown-linux.zip, if-no-files-found: error }

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/csd-v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/windows/ColonyShipDown-windows.zip
            out/linux/ColonyShipDown-linux.zip
          body: |
            **Colony Ship Down** - download, unzip, play.

            * Windows: unzip, double-click `ColonyShipDown.exe`.
              If SmartScreen says "Windows protected your PC", click **More info -> Run anyway**
              (new, unsigned program).
            * Linux: unzip, run `./ColonyShipDown`.

            The official server (45.143.196.182) is already filled in.
